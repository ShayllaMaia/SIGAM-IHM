<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="login.css" />
  <title>SIGAM</title>
  <!-- Importando SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    function validateLogin(event) {
      event.preventDefault(); // Impede o envio do formulário
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // Verificação das credenciais
      if (email === 'lider@gmail.com' && password === 'senha123') {
        // Se as credenciais estiverem corretas, redireciona para a página de destino
        window.location.href = '/lider/home/home.html';
      } else {
        // Se as credenciais estiverem incorretas, exibe uma mensagem de erro com SweetAlert2
        Swal.fire({
          title: 'E-mail ou senha incorretos!',
          text: 'Tente novamente.',
          icon: 'error',
          confirmButtonText: 'Ok'
        });
      }
    }
  </script>
</head>
<body>
  <div class="login_form">
    <form onsubmit="validateLogin(event)">
      <h3>ENTRAR NA CONTA</h3>
      <div class="input_box">
        <label for="email">E-mail</label>
        <input type="email" id="email" required />
      </div>
      <div class="input_box">
        <label for="password">Senha</label>
        <input type="password" id="password" class="password_input" required />
        <a href="/lider/redefinir-senha/redefinir-senha.html" class="forgot_password">Esqueceu a senha?</a>
      </div>
      <button type="submit">ENTRAR</button>
      <p class="ou">ou</p>
      <p class="sign_up"><a href="/lider/registro/registro.html">REGISTRE-SE</a></p>
    </form>
  </div>
</body>
</html>
