<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/membro-comum/restricao-cadastrada/restricao-cadastrada.css">
    <title>SIGAM - Restrições Cadastradas</title>
    <script src="https://kit.fontawesome.com/235f8c027b.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="#" class="navbar-brand">
            <img src="/membro-comum/home/logoIBB.png" alt="Logo" class="logo">
        </a>
        <div class="nav-links" id="navLinks">
            <a href="/membro-comum/home/home.html">Home</a>
            <a href="#">Escala</a>
            <a href="/membro-comum/login-membro-comum/login.html"><i class="fa-solid fa-right-from-bracket"
                    style="color: #ffffff;"></i></a>
        </div>
        <!-- Dropdown button for mobile -->
        <div class="dropdown">
            <button class="dropbtn" onclick="toggleMenu()">
                <i class="fa fa-bars"></i>
            </button>
            <div class="dropdown-content" id="dropdownMenu">
                <a href="/membro-comum/home/home.html">Home</a>
                <a href="#">Escala</a>
                <a href="/membro-comum/login-membro-comum/login.html"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
        </div>
    </div>

    <!-- Conteúdo -->
    <div>
        <h1 style="text-align: center; margin: 35px 0;">Restrição de Dias e Horários</h1>
        <div class="outer-container">
            <div class="container">
                <div class="restriction-section">
                    <label for="dias-semana">Dias da Semana:</label>
                    <div id="dias-semana" class="dias-semana">
                        <label><input type="checkbox" class="dia-semana"> Domingo</label>
                        <label><input type="checkbox" class="dia-semana"> Segunda</label>
                        <label><input type="checkbox" class="dia-semana"> Terça</label>
                        <label><input type="checkbox" class="dia-semana"> Quarta</label>
                        <label><input type="checkbox" class="dia-semana"> Quinta</label>
                        <label><input type="checkbox" class="dia-semana"> Sexta</label>
                        <label><input type="checkbox" class="dia-semana"> Sábado</label>
                    </div>

                    <div class="hora-container">
                        <label for="hora-inicio">Hora Início:</label>
                        <input type="time" id="hora-inicio" name="hora-inicio">
                        <label for="hora-fim">Hora Fim:</label>
                        <input type="time" id="hora-fim" name="hora-fim">
                    </div>
                </div>

                <div class="button-section">
                    <a href="/membro-comum/restricao-diasHoras/restricao-diasHoras.html">
                        <button type="button" id="voltar">Voltar</button>
                    </a>
                    <button id="nova-restricao">Salvar nova restrição</button>
                    <button id="enviar-solicitacao">Solicitar Entrada</button>
                </div>
            </div>
        </div>

        <!-- Restrições Cadastradas -->
        <div class="outer-container">
            <h1 style="text-align: center; margin: 35px 0;">Restrições Cadastradas</h1>
            <div class="restricoes-cadastradas">
                <!-- O conteúdo das restrições será carregado aqui -->
            </div>
        </div>

    </div>

    <script>
        function carregarRestricoes() {
            // Recupera as restrições do localStorage
            const restricao = localStorage.getItem('restricao');

            if (restricao) {
                const { dias, horaInicio, horaFim } = JSON.parse(restricao);
                const restricoesContainer = document.querySelector('.restricoes-cadastradas');

                // Cria um novo elemento para a restrição
                const novaRestricao = document.createElement('div');
                novaRestricao.innerHTML = `
                    <span>${dias} das ${horaInicio} até ${horaFim}</span>
                    <button class="remover-restricao" onclick="removerRestricao(this)">Remover</button>
                `;

                // Adiciona a nova restrição ao container
                restricoesContainer.appendChild(novaRestricao);

                // Limpa o localStorage após exibir os dados
                localStorage.removeItem('restricao');
            }
        }

        // Chama a função para carregar as restrições ao carregar a página
        window.onload = carregarRestricoes;

        // Função para remover restrição
        function removerRestricao(botao) {
            Swal.fire({
                title: 'Remover Restrição?',
                text: "Você tem certeza que deseja remover esta restrição?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sim, remover!',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    botao.parentElement.remove(); // Remove o parágrafo que contém a restrição
                    Swal.fire('Removido!', 'A restrição foi removida com sucesso.', 'success');
                }
            });
        }

        // Validação e armazenamento da nova restrição
        document.getElementById('nova-restricao').addEventListener('click', function () {
            const diasSelecionados = document.querySelectorAll('.dia-semana:checked');
            const horaInicio = document.getElementById('hora-inicio').value;
            const horaFim = document.getElementById('hora-fim').value;

            // Verifica se há dias selecionados e se as horas estão preenchidas
            if (diasSelecionados.length === 0 || !horaInicio || !horaFim) {
                Swal.fire({
                    title: 'Campos Inválidos!',
                    text: 'Por favor, selecione pelo menos um dia da semana e preencha as horas de início e fim da restrição.',
                    icon: 'warning',
                    confirmButtonText: 'Ok'
                });
            } else {
                // Cria uma string para os dias selecionados
                const dias = Array.from(diasSelecionados).map(dia => dia.parentElement.textContent.trim()).join(', ');

                // Armazena os dados no localStorage
                const restricao = { dias: dias, horaInicio: horaInicio, horaFim: horaFim };
                localStorage.setItem('restricao', JSON.stringify(restricao));

                // Redireciona para a página de restrições cadastradas
                window.location.href = "/membro-comum/restricao-cadastrada/restricao-cadastrada.html";
            }
        });

        document.getElementById('enviar-solicitacao').addEventListener('click', function () {
            Swal.fire({
                title: 'Solicitação Enviada!',
                text: 'Sua solicitação foi enviada com sucesso!',
                icon: 'success',
                confirmButtonText: 'OK'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = '/membro-comum/lista-ministerio-atualizada/lista-ministerio.html'; // Redireciona após o clique em OK
                }
            });
        });
    </script>

</body>

</html>
